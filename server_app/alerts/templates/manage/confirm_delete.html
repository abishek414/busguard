{% extends "base.html" %}
{% block title %}Delete - BusGuard{% endblock %}
{% block content %}
<div class="card shadow-sm border-danger" style="max-width: 560px">
  <div class="card-body">
    <h1 class="h5">Delete {{ what }}?</h1>
    <p class="text-secondary">{{ details }} This can't be undone.</p>
    <form method="post" class="d-flex gap-2">
      {% csrf_token %}
      <button class="btn btn-danger">Yes, delete</button>
      <a class="btn btn-outline-secondary" href="{{ back }}">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
